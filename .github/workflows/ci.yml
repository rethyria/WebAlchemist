name: CI

on:
  push:
  pull_request:

# The workflow only reads the repository. It publishes nothing and needs no
# token with write access.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The README requires Node 22 or later. The version is pinned to the
      # major version that is tested locally.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # web-ext lint exits with a non-zero status only when it reports errors.
      # Warnings, such as UNSAFE_VAR_ASSIGNMENT from the Svelte runtime, are
      # printed and do not fail the step.
      - name: Lint the extension
        run: npm run lint:ext

      # Fails on high and critical advisories in runtime dependencies. Lower
      # severities and development dependencies are reported by Dependabot
      # and do not affect the shipped extension.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      # Supports the source-code submission in issue 41: a reviewer who builds
      # the submitted source must get the same files as the submitted package.
      - name: Check that the build is reproducible
        run: |
          rm -rf dist
          npm run build
          cp -r dist "$RUNNER_TEMP/build-first"
          rm -rf dist
          npm run build
          diff -r "$RUNNER_TEMP/build-first" dist
